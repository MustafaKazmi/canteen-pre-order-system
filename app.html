<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Canteen</title>
  <link rel="stylesheet" href="app.css">
</head>
<div id="toast" class="toast"></div>
<body>

<script>

//alert
  function showToast(message, type = "success") {
  const toast = document.getElementById("toast");

  toast.innerText = message;
  toast.className = `toast show ${type}`;

  setTimeout(() => {
    toast.className = "toast";
  }, 3000);
}


const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if (!user || !token) {
  showToast("Please login first", "error");
  window.location.href = "index.html";
}
</script>

<div class="container">

  <!-- HERO -->
  <div class="hero-card">
    <div class="hero-title">Welcome back, <span id="userName"></span></div>
    <div class="hero-subtitle">Order quickly from Smart Canteen.</div>

    <div class="wallet-balance">
      ₹<span id="walletBalance">0</span>
    </div>

    <div class="hero-actions">
      <button onclick="goToHistory()">View Orders</button>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="layout">

    <!-- MENU -->
    <div>
      <div class="menu-grid" id="products"></div>
    </div>

    <!-- CART -->
    <div class="cart-panel">
      <div class="cart-summary">
        <div>
          <strong>Cart</strong><br>
          <span id="cartSummary">0 items • ₹0</span>
        </div>
        <button onclick="toggleCart()">View</button>
      </div>

      <div class="cart-items" id="cartItems"></div>
    </div>

  </div>

</div>

<script>
const BASE = "http://localhost:3000";
let products = [];
let cart = [];
let cartVisible = false;

document.getElementById("userName").innerText = user.name;

function fetchWallet() {
  fetch(BASE + "/user/" + user.id)
    .then(res => res.json())
    .then(data => {
      document.getElementById("walletBalance").innerText = data.wallet_balance;
    });
}

function fetchProducts() {
  fetch(BASE + "/products")
    .then(res => res.json())
    .then(data => {
      products = data;
      renderProducts();
    });
}

function renderProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach(product => {
    const div = document.createElement("div");
    div.className = "menu-item";

    div.innerHTML = `
      <div style="
        width:100%;
        height:140px;
        border-radius:18px;
        background:rgba(127,127,127,0.12);
        display:flex;
        align-items:center;
        justify-content:center;
        margin-bottom:14px;
        font-size:2rem;
      ">🍽️</div>

      <h4>${product.name}</h4>
      <div class="menu-meta">Freshly prepared</div>
      <div><strong>₹${product.price}</strong></div>
      <div class="menu-meta">
        ${product.stock > 0 ? "In Stock" : "Out of Stock"}
      </div>

      <div class="qty-row">
        <button onclick="changeQty(${product.id}, -1)">-</button>
        <input id="qty_${product.id}" value="1" readonly>
        <button onclick="changeQty(${product.id}, 1)">+</button>
      </div>

      <button style="margin-top:14px;" onclick="addToCart(${product.id})">
        Add to Cart
      </button>
    `;

    container.appendChild(div);
  });
}

function changeQty(id, change) {
  const input = document.getElementById("qty_" + id);
  let qty = Number(input.value) + change;

  if (qty < 1) qty = 1;

  input.value = qty;
}

function addToCart(productId) {
  const qty = Number(document.getElementById("qty_" + productId).value);
  const product = products.find(p => Number(p.id) === Number(productId));

  if (!product || product.stock <= 0) {
    showToast("Out of stock", "error");
    return;
  }

  const existing = cart.find(item => Number(item.id) === Number(productId));

  if (existing) {
    existing.quantity += qty;
  } else {
    cart.push({
      ...product,
      quantity: qty
    });
  }

  renderCart();
  document.getElementById("qty_" + productId).value = 1;
}

function renderCart() {
  const container = document.getElementById("cartItems");
  container.innerHTML = "";

  let total = 0;
  let count = 0;

  cart.forEach(item => {
    total += item.price * item.quantity;
    count += item.quantity;

    const div = document.createElement("div");
    div.className = "order-card";

    div.innerHTML = `
  <strong>${item.name}</strong><br>
  ₹${item.price * item.quantity}

  <div class="qty-row" style="margin-top:12px;">
    <button onclick="updateCartQty(${item.id}, -1)">-</button>
    <input value="${item.quantity}" readonly>
    <button onclick="updateCartQty(${item.id}, 1)">+</button>
  </div>

  <div style="margin-top:12px;">
    <button onclick="removeFromCart(${item.id})" class="logout">
      Remove
    </button>
  </div>
`;

    container.appendChild(div);
  });

  document.getElementById("cartSummary").innerText =
    `${count} items • ₹${total}`;

  if (cart.length > 0) {
    const orderBtn = document.createElement("button");
    orderBtn.innerText = "Place Order";
    orderBtn.style.width = "100%";
    orderBtn.onclick = placeOrder;
    container.appendChild(orderBtn);
  }
}

function removeFromCart(id) {
  cart = cart.filter(item => item.id !== id);
  renderCart();
}

function toggleCart() {
  const cartDiv = document.getElementById("cartItems");
  cartVisible = !cartVisible;

  if (cartVisible) {
    cartDiv.classList.add("active");
  } else {
    cartDiv.classList.remove("active");
  }
}

function placeOrder() {
  if (cart.length === 0) {
    showToast("Cart is empty", "error");
    return;
  }

  fetch(BASE + "/generate-token")
    .then(res => res.json())
    .then(tokenData => {

      fetch(BASE + "/order", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          user_id: user.id,
          cart: cart,
          token: tokenData.token
        })
      })
      .then(res => res.json())
      .then(data => {

        if (!data.success) {
          showToast(data.message, "error");
          return;
        }

        cart = [];
        renderCart();
        fetchWallet();
        fetchProducts();

        showToast("Order Confirmed! Token #" + data.token, "success");
      });

    });
}

function goToHistory() {
  window.location.href = "history.html";
}

function logout() {
  localStorage.removeItem("user");
  localStorage.removeItem("token");
  window.location.href = "index.html";
}

function updateCartQty(id, change) {
  const item = cart.find(i => Number(i.id) === Number(id));

  if (!item) return;

  const newQty = item.quantity + change;

  if (newQty <= 0) {
    removeFromCart(id);
    return;
  }

  const product = products.find(p => Number(p.id) === Number(id));

  if (product && newQty > product.stock) {
    showToast("Not enough stock", "error");
    return;
  }

  item.quantity = newQty;
  renderCart();
}


fetchWallet();
fetchProducts();
</script>

</body>
</html>
